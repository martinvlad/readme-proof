<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">The README Proof review boundary</title><desc id="d">Untrusted README text goes through deterministic analysis into findings and a proposed verification plan. Actual installation tests are separate.</desc><style>.line{stroke-dasharray:8 10;animation:move 4s linear infinite}@keyframes move{to{stroke-dashoffset:-90}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style><rect width="1000" height="280" rx="16" fill="#0b111b"/><path class="line" d="M160 112H850" stroke="#a798ff" stroke-width="3"/><g font-family="sans-serif" font-size="17" fill="#eef2fa"><rect x="40" y="72" width="250" height="80" rx="12" fill="#172031" stroke="#455169"/><text x="68" y="118">Untrusted Markdown</text><rect x="375" y="72" width="250" height="80" rx="12" fill="#172031" stroke="#a798ff"/><text x="401" y="118">Deterministic analysis</text><rect x="710" y="72" width="250" height="80" rx="12" fill="#172031" stroke="#c5ff65"/><text x="742" y="118">Findings + review plan</text></g><text x="40" y="214" font-family="sans-serif" font-size="16" fill="#c5ff65">Static findings are evidence of a rule match, not proof of a successful installation.</text><text x="40" y="248" font-family="sans-serif" font-size="14" fill="#8b9ab0">Review commands and isolate the environment before separately authorized execution.</text></svg>
