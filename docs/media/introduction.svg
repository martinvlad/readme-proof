<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">README Proof</title><desc id="d">Check README portability and command risks, then export evidence. Static analysis never executes README commands.</desc><defs><linearGradient id="g"><stop stop-color="#a798ff"/><stop offset="1" stop-color="#c5ff65"/></linearGradient></defs><style>.trace{stroke-dasharray:15 16;animation:flow 3s linear infinite}.glow{animation:glow 3s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-93}}@keyframes glow{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.trace,.glow{animation:none}}</style><rect width="1200" height="400" rx="22" fill="#0b111b"/><rect x="1" y="1" width="1198" height="398" rx="22" fill="none" stroke="#2b3549"/><text x="55" y="59" font-family="sans-serif" font-size="13" letter-spacing="4" fill="#a798ff">RUVNET / DEVELOPER EXPERIENCE</text><text x="55" y="134" font-family="sans-serif" font-size="56" font-weight="700" fill="#f2f5ff">README <tspan fill="#c5ff65">PROOF</tspan></text><text x="57" y="181" font-family="sans-serif" font-size="22" fill="#adb9cc">Make the first run count.</text><path class="trace" d="M130 267H1060" stroke="url(#g)" stroke-width="3" fill="none"/><g font-family="sans-serif" font-size="18" fill="#eef2fa"><rect x="55" y="232" width="280" height="70" rx="12" fill="#151d2c" stroke="#59627e"/><text x="80" y="275">01 / Inspect Markdown</text><rect x="454" y="232" width="280" height="70" rx="12" fill="#151d2c" stroke="#a798ff"/><text x="479" y="275">02 / Explain findings</text><rect x="853" y="232" width="290" height="70" rx="12" fill="#151d2c" stroke="#c5ff65"/><text x="878" y="275">03 / Export evidence</text></g><circle class="glow" cx="1109" cy="61" r="6" fill="#c5ff65"/><text x="55" y="357" font-family="sans-serif" font-size="15" fill="#8493a9">CLI · browser · MCP · structured receipts</text><text x="720" y="357" font-family="sans-serif" font-size="15" fill="#c5ff65">No README command execution</text></svg>
